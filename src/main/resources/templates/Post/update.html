<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게시글 수정</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main><div class="eyebrow">SPRING BOARD</div><h1>게시글 수정</h1><form th:action="@{/Post/update(PostNo=${post.postNo})}" method="post" th:object="${post}">
<label for="title">제목</label><input id="title" th:field="*{title}" maxlength="200" required><p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
<label for="writer">작성자</label><input id="writer" th:field="*{writer}" maxlength="50" required><p class="error" th:if="${#fields.hasErrors('writer')}" th:errors="*{writer}"></p>
<label for="content">내용</label><textarea id="content" th:field="*{content}" maxlength="10000" required></textarea><p class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></p>
<div class="actions"><button type="submit">수정</button><a class="button secondary" th:href="@{/Post/list}">목록</a></div></form>
<form th:action="@{/Post/delete}" method="post" onsubmit="return confirm('게시글을 삭제하시겠습니까?');"><input type="hidden" name="PostNo" th:value="${post.postNo}"><button class="danger" type="submit">삭제</button></form></main></body></html>
