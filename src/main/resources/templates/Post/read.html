<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게시글 조회</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><main><div class="eyebrow">SPRING BOARD</div>
<h1 th:text="${post.title}"></h1><p class="meta">글번호 <span th:text="${post.postNo}"></span> · <span th:text="${post.writer}"></span> · <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>
<div class="content" th:text="${post.content}"></div><div class="actions"><a class="button" th:href="@{/Post/update(PostNo=${post.postNo})}">수정</a><a class="button secondary" th:href="@{/Post/list}">목록</a></div>
</main></body></html>
