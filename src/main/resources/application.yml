spring:
  datasource:
    url: jdbc:h2:file:./data/postdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
  thymeleaf:
    cache: false
mybatis:
  mapper-locations: classpath:mapper/*.xml
server:
  port: 8080
